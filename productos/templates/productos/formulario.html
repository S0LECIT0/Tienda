<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto</title>
</head>
<body>
    
    <h1>Producto</h1>

    <form method="POST">
        {% csrf_token %}

        <p>
            <label>Nombre:
                <input type="text" name="nombre" value="{{ producto.nombre|default:'' }}" required>
            </label>
        </p>

        <p>
            <label>Categoria:
                <input type="text" name="categoria" value="{{ producto.categoria|default:'' }}" required>
            </label>
        </p>

        <p>
            <label>Precio:
                <input type="number" step="0.01" name="precio" value="{{ producto.precio|default:'' }}" required>
            </label>
        </p>

        <p>
            <label>Cantidad:
                <input type="number" name="cantidad" value="{{ producto.cantidad|default:'' }}" required>
            </label>
        </p>

        <button type="submit">
            Guardar
        </button>

    </form>

    <br>

    <a href="/productos/">
        Ver productos
    </a>

</body>
</html>
