{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias</title>
    <link rel="stylesheet" href="{% static 'categorias/categorias.css' %}">
</head>
<body class="pagina-categorias">
    <main class="contenedor">
        <header class="encabezado">
            <div>
                <h1>Categorias</h1>
            </div>
            <a class="boton" href="/categorias/">Crear nueva categoria</a>
        </header>

        <section class="lista-categorias">
            {% for categoria in categorias %}
                <article class="categoria">
                    <div>
                        <h2>{{ categoria.nombre }}</h2>
                        <p>{{ categoria.descripcion }}</p>
                    </div>
                    <nav class="acciones" aria-label="Acciones de {{ categoria.nombre }}">
                        <a href="/categorias/editar/{{ categoria.id }}">Editar</a>
                        <a class="enlace-eliminar" href="/categorias/eliminar/{{ categoria.id }}">Eliminar</a>
                    </nav>
                </article>
            {% empty %}
                <p class="vacio">No hay categorias disponibles.</p>
            {% endfor %}
        </section>
    </main>
</body>
</html>
