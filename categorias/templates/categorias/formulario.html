{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categoria</title>
    <link rel="stylesheet" href="{% static 'categorias/categorias.css' %}">
</head>
<body class="pagina-formulario">
    <main class="contenedor contenedor-formulario">
        <a class="volver" href="/categorias/lista/">&larr; Ver categorias</a>
        <h1>Categoria</h1>

        <form method="POST" class="formulario">

            {% csrf_token %}

            <p class="campo">
                <label for="nombre">Nombre</label>
                <input id="nombre" type="text" name="nombre" value="{{ categoria.nombre|default:'' }}" required>
            </p>

            <p class="campo">
                <label for="descripcion">Observaciones</label>
                <textarea id="descripcion" name="descripcion" rows="5" required>{{ categoria.descripcion|default:'' }}</textarea>
            </p>

            <button class="boton" type="submit">Guardar</button>

        </form>
    </main>

</body>
</html>
