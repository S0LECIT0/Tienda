{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle</title>
    <link rel="stylesheet" href="{% static 'categorias/categorias.css' %}">
</head>
<body>
    
    <main class="contenedor detalle">
    <h1>Detalle de la categoria</h1>

    <p><strong>Nombre:</strong> {{ categoria.nombre }}</p>
    <p><strong>Observaciones:</strong> {{ categoria.observaciones }}</p>

    <a class="boton" href="/categorias/editar/{{ categoria.id }}/">Editar</a>
    <a href="/categorias/listar">Volver</a>
</main>

</body>
</html>
